repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run ruff check --force-exclude
        types: [python]
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run ruff format --force-exclude
        types: [python]
      - id: ty-check
        name: ty check
        language: system
        entry: uv run ty check
        types: [python]
