[project]
name = "jinjantic"
version = "0.1.0"
description = "Typed Jinja2 templates for FastAPI powered by Pydantic models"
readme = "README.md"
authors = [
    { name = "Max Mantei", email = "max.mantei@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.3",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.ty.src]
include = ["src", "tests"]
exclude = [".venv"]

[tool.ty.environment]
python = ".venv/bin/python"
